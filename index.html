<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus</title>
<meta name="description" content="A private chat for your own notes.">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nexus">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <header class="bar">
    <button id="btn-chats" class="icon" type="button" aria-label="Chats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="title"><strong>Nexus</strong><small id="status">Starting…</small></div>
    <button id="btn-new" class="icon" type="button" aria-label="New chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="btn-settings" class="icon" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="log" aria-live="polite"></main>

  <form id="composer" autocomplete="off">
    <div id="attachments" hidden></div>
    <div class="row">
      <label class="icon attach" aria-label="Add photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <input id="file" type="file" accept="image/*" multiple>
      </label>
      <textarea id="input" rows="1" placeholder="Ask, or tell me what happened…" aria-label="Message"></textarea>
      <button id="btn-send" class="send" type="submit" aria-label="Send"></button>
    </div>
  </form>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-backdrop"></div>
  <nav class="drawer-panel" aria-label="Chats">
    <h2>Chats</h2>
    <p class="hint">Saved on this phone only.</p>
    <ul id="chat-list"></ul>
  </nav>
</div>

<dialog id="settings">
  <form id="settings-form" autocomplete="off">
    <div class="dialog-head">
      <h2>Settings</h2>
      <button id="btn-close" class="icon" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="hint">Keys are saved on this phone only. Nothing is sent anywhere except Google (Gemini) and GitHub.</p>

    <label>Gemini API key
      <input name="geminiKey" class="masked" required autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label>GitHub token
      <input name="githubToken" class="masked" required autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label>Repository
      <input name="repo" required placeholder="owner/repo" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>

    <details>
      <summary>Model and files</summary>
      <label>Model
        <input name="model" list="models" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <label>Backup model, used when the limit is hit
        <input name="fallbackModel" list="models" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <datalist id="models">
        <option value="gemini-3.8-flash"></option>
        <option value="gemini-3.5-flash-lite"></option>
        <option value="gemini-3.1-flash-lite"></option>
        <option value="gemini-flash-latest"></option>
        <option value="gemini-flash-lite-latest"></option>
      </datalist>
      <label>Thinking
        <select name="thinking">
          <option value="low">Low: fastest</option>
          <option value="medium">Medium</option>
          <option value="high">High: slowest, most careful</option>
        </select>
      </label>
      <label>Branch
        <input name="branch" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <label>Files read at the start of every answer
        <input name="preload" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
    </details>

    <div class="buttons">
      <button id="btn-test" type="button">Test connection</button>
      <button class="primary" type="submit">Save</button>
    </div>
    <pre id="test-result"></pre>

    <details>
      <summary>More</summary>
      <div class="buttons">
        <button id="btn-refresh" type="button">Reload all files</button>
        <button id="btn-wipe" type="button" class="danger">Delete all chats</button>
      </div>
    </details>
  </form>
</dialog>
</body>
</html>
